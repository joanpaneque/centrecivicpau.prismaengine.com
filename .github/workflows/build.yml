name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The Windows print program (print-agent/). Its version only changes when print-agent/
  # changes, so the PCs of the bar update themselves only when there is something new.
  print-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the program
        run: |
          VERSION="1.0.$(git rev-list --count HEAD -- print-agent)"
          dotnet publish print-agent/App -c Release -o print-agent/dist -p:Version="$VERSION"
          echo "$VERSION" > print-agent/dist/version.txt

      - name: Upload it to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: print-agent/dist/CentreCivicImpressio.exe,print-agent/dist/version.txt
          target: /root/centrecivicpau.prismaengine.com/storage/app/private/print-agent/incoming
          strip_components: 2
          overwrite: true

  deploy:
    needs: print-agent
    # Deploy the app even if the print program could not be built.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            DIR=/root/centrecivicpau.prismaengine.com
            REPO=git@github.com:joanpaneque/centrecivicpau.prismaengine.com.git
            SERVICE=centrecivicpau.prismaengine.com

            mkdir -p "$DIR"
            cd "$DIR"

            if [ ! -d .git ]; then
              git init
              git checkout -B main
              git remote add origin "$REPO" 2>/dev/null || git remote set-url origin "$REPO"
            fi

            git fetch origin
            git reset --hard origin/main

            mkdir -p storage/framework/{sessions,views,cache/data,testing} storage/logs storage/app/public storage/app/private bootstrap/cache
            chown -R 1000:1000 storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache

            if [ ! -f .env ]; then
              echo ".env no encontrado; omitiendo arranque de contenedores."
              exit 0
            fi

            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"

            $COMPOSE up -d --build
            $COMPOSE exec -T $SERVICE composer install --no-interaction --prefer-dist --optimize-autoloader
            $COMPOSE exec -T $SERVICE npm ci
            $COMPOSE exec -T $SERVICE npm run build:ssr
            $COMPOSE exec -T $SERVICE php artisan migrate --force
            $COMPOSE exec -T $SERVICE php artisan storage:link --force
            $COMPOSE exec -T $SERVICE php artisan optimize:clear
            $COMPOSE exec -T $SERVICE php artisan queue:restart
            $COMPOSE restart $SERVICE queue scheduler

            # Publish the print program: the .exe first, then its version (the PCs update
            # when they see the new version, so the file must already be complete).
            AGENT=storage/app/private/print-agent
            if [ -f "$AGENT/incoming/CentreCivicImpressio.exe" ] && [ -f "$AGENT/incoming/version.txt" ]; then
              mv -f "$AGENT/incoming/CentreCivicImpressio.exe" "$AGENT/CentreCivicImpressio.exe"
              mv -f "$AGENT/incoming/version.txt" "$AGENT/version.txt"
              chown -R 1000:1000 "$AGENT"
            fi
